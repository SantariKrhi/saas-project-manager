services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/saas}
      MONGO_DB: ${MONGO_DB:-saas}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ACTIVITY_TTL_DAYS: ${ACTIVITY_TTL_DAYS:-90}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  mongo-data:
